# Sample nginx reverse proxy for the Dot Weaver API.
# Put this alongside your existing predgo config (e.g. /etc/nginx/sites-available/dotweaver-api)
# and obtain a cert with: certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# After certbot runs it adds the listen 443 / ssl_certificate lines and a
# redirect from 80 -> 443 automatically.
